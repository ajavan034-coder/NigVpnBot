<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --violet-300: #c4b5fd; --violet-400: #a78bfa; --violet-500: #8b5cf6;
            --violet-600: #7c3aed; --violet-700: #6d28d9;
            --bg-deep: #0b0714; --bg-elevated: #1e1535;
            --border-subtle: rgba(167,139,250,.12); --border-default: rgba(167,139,250,.25);
            --text-primary: #f2eefb; --text-secondary: #b3a6d4; --text-muted: #71648f;
        }
        * { font-family: 'Vazirmatn', -apple-system, sans-serif; }
        body {
            background: var(--bg-deep); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; color: var(--text-primary);
        }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35; pointer-events: none; }
        .orb-1 { width: 480px; height: 480px; background: #6d28d9; top: -160px; right: -120px; animation: float1 14s ease-in-out infinite alternate; }
        .orb-2 { width: 380px; height: 380px; background: #4c1d95; bottom: -140px; left: -100px; animation: float2 18s ease-in-out infinite alternate; }
        @keyframes float1 { to { transform: translate(-60px, 50px) scale(1.08); } }
        @keyframes float2 { to { transform: translate(50px, -40px) scale(1.05); } }

        .login-wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; }
        .login-card {
            background: rgba(23,16,40,.82); backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle); border-radius: 24px;
            padding: 42px 36px; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
            animation: rise .5s cubic-bezier(.34,1.3,.64,1);
        }
        @keyframes rise { from { transform: translateY(22px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .login-icon {
            width: 74px; height: 74px; margin: 0 auto 22px; color: #fff;
            background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 34px rgba(124,58,237,.45), inset 0 1px 0 rgba(255,255,255,.18);
        }
        svg.logo { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .login-card h2 { font-weight: 800; font-size: 21px; text-align: center; margin-bottom: 6px; }
        .login-card .subtitle { color: var(--text-muted); text-align: center; font-size: 13.5px; margin-bottom: 30px; }

        .form-control {
            background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text-primary);
            border-radius: 13px; padding: 12px 16px; font-size: 14px; transition: all .2s;
        }
        .form-control:focus {
            background: var(--bg-elevated); border-color: var(--violet-500); color: var(--text-primary);
            box-shadow: 0 0 0 3.5px rgba(139,92,246,.15);
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-label { color: var(--text-secondary); font-weight: 600; font-size: 12.5px; margin-bottom: 7px; }

        .btn-login {
            background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
            border: none; color: #fff; font-weight: 700; font-size: 15px;
            padding: 13px; border-radius: 14px; width: 100%; transition: all .2s;
            box-shadow: 0 6px 24px rgba(124,58,237,.4), inset 0 1px 0 rgba(255,255,255,.15);
            display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 10px;
        }
        .btn-login:hover { background: linear-gradient(135deg, var(--violet-400), var(--violet-600)); color: #fff; transform: translateY(-1px); box-shadow: 0 9px 32px rgba(124,58,237,.5); }
        svg.ic { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .alert { border-radius: 12px; border: none; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .alert-danger { background: rgba(248,113,113,.1); color: #f87171; border: 1px solid rgba(248,113,113,.2); }
        .alert-warning { background: rgba(251,191,36,.1); color: #fbbf24; border: 1px solid rgba(251,191,36,.2); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-logo" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3.5"/><circle cx="9" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.1" fill="currentColor" stroke="none"/><path d="M12 8V4.5"/><circle cx="12" cy="3.2" r="1.2"/><path d="M2 13v3M22 13v3"/></symbol>
        <symbol id="i-login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></symbol>
        <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></symbol>
        <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
    </svg>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon"><svg class="logo"><use href="#i-logo"/></svg></div>
            <h2>پنل مدیریت نیگ‌سیتی</h2>
            <p class="subtitle">برای ادامه وارد حساب خود شوید</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2 mb-3" role="alert">
                <svg class="ic ic-sm"><use href="#i-{% if cat == 'danger' %}x-circle{% else %}alert-triangle{% endif %}"/></svg>
                {{ msg }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" name="username" class="form-control" placeholder="نام کاربری خود را وارد کنید" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-login">
                    ورود به پنل
                    <svg class="ic"><use href="#i-login"/></svg>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
