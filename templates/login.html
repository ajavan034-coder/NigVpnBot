<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7e22ce;
            --purple-800: #6b21a8;
            --purple-900: #581c87;
            --bg-deep: #0a0612;
            --bg-card: #160e2a;
            --bg-elevated: #1d1336;
            --border-subtle: #2a1d4a;
            --text-primary: #f0eaf8;
            --text-secondary: #a89bc4;
            --text-muted: #6d5f8a;
        }
        * { font-family: 'Inter', -apple-system, sans-serif; }
        body {
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(139,92,246,.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(124,58,237,.06) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite alternate;
        }
        @keyframes drift { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-3%, 3%) rotate(2deg); } }
        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px; padding: 20px;
        }
        .login-card {
            background: rgba(22,14,42,.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        .login-icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--purple-600), var(--purple-800));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: white;
            box-shadow: 0 8px 30px rgba(139,92,246,.3);
        }
        .login-card h2 {
            color: var(--text-primary);
            font-weight: 800;
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-control {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all .2s;
        }
        .form-control:focus {
            background: var(--bg-elevated);
            border-color: var(--purple-600);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(139,92,246,.15);
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-label { color: var(--text-secondary); font-weight: 500; font-size: 13px; }
        .btn-login {
            background: linear-gradient(135deg, var(--purple-600), var(--purple-700));
            border: none;
            color: white;
            font-weight: 700;
            font-size: 15px;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            transition: all .2s;
            box-shadow: 0 4px 20px rgba(139,92,246,.3);
            margin-top: 8px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, var(--purple-500), var(--purple-600));
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(139,92,246,.4);
        }
        .btn-login:active { transform: translateY(0); }
        .alert { border-radius: 10px; border: none; font-size: 13px; }
        .alert-danger { background: rgba(239,68,68,.1); color: #f87171; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon">
                <i class="bi bi-robot"></i>
            </div>
            <h2>پنل مدیریت ربات</h2>
            <p class="subtitle">برای ادامه وارد شوید</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2" role="alert">{{ msg }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" name="username" class="form-control" placeholder="نام کاربری خود را وارد کنید" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" name="password" class="form-control" placeholder="رمز عبور" required>
                </div>
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-left"></i> ورود
                </button>
            </form>
        </div>
    </div>
</body>
</html>
