<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0a0e17; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .done-card { background: #131926; border: 1px solid #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 440px; text-align: center; }
        .check-icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(34,197,94,.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .check-icon i { font-size: 40px; color: #22c55e; }
        .btn-primary { background: #6366f1; border-color: #6366f1; }
        .btn-primary:hover { background: #4f46e5; border-color: #4f46e5; }
    </style>
</head>
<body>
    <div class="done-card">
        <div class="check-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2 style="color:#e2e8f0;font-weight:700;">Setup Complete!</h2>
        <p class="text-muted mt-3 mb-4">
            Your bot is restarting now. This page will refresh automatically in <strong id="countdown">10</strong> seconds.
            <br><br>
            If it doesn't, click the button below.
        </p>
        <a href="/login" class="btn btn-primary px-4" id="loginBtn">
            <i class="bi bi-box-arrow-in-right"></i> Go to Dashboard
        </a>
    </div>
    <script>
        let seconds = 10;
        const el = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            el.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/login';
            }
        }, 1000);
    </script>
</body>
</html>
